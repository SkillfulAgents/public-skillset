<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;background:#fff;width:960px;height:540px;overflow:hidden;font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif;color:#111}
  .card{position:absolute;left:80px;top:120px;width:800px;height:300px;border-radius:28px;background:#fff;box-shadow:0 20px 60px rgba(0,0,0,.12);border:1px solid #eee;padding:40px;box-sizing:border-box}
  .title{font-size:34px;font-weight:600;letter-spacing:-.01em}
  .sub{font-size:24px;color:#777;margin-top:10px}
  .badge{position:absolute;right:40px;top:40px;padding:14px 26px;border-radius:999px;font-size:26px;font-weight:600;color:#fff;transform-origin:center}
  .row{position:absolute;left:40px;bottom:40px;right:40px;height:16px;border-radius:8px;background:#f0f0f0;overflow:hidden}
  .fill{height:100%;border-radius:8px}
</style>
</head>
<body>
<div class="card">
  <div class="title" id="title"></div>
  <div class="sub" id="sub"></div>
  <div class="badge" id="badge"></div>
  <div class="row"><div class="fill" id="fill"></div></div>
</div>
<script>
  // Sample clip following the studio contract (see build-product-visual skill).
  // Params: ?title=Invoice%20%23482&sub=Acme%20Co%20%C2%B7%20%241%2C200&from=Overdue&to=Paid&color=%2316a34a
  window.ANIM = {duration: 6, fps: 30, params: {}};
  const q = new URLSearchParams(location.search);
  const P = ANIM.params;
  P.title = q.get('title') || 'Invoice #482';
  P.sub = q.get('sub') || 'Acme Co · $1,200 · due 14 days ago';
  P.from = q.get('from') || 'Overdue';
  P.to = q.get('to') || 'Paid';
  P.color = q.get('color') || '#16a34a';
  document.getElementById('title').textContent = P.title;
  document.getElementById('sub').textContent = P.sub;
  const badge = document.getElementById('badge');
  const fill = document.getElementById('fill');
  const card = document.querySelector('.card');
  const ease = (x) => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
  const spring = (x) => { x = Math.min(1, Math.max(0, x)); return 1 - Math.exp(-6 * x) * Math.cos(9 * x); };

  window.seek = function (t) {
    // 0–0.6s card slides in; 0.6–2.4s bar fills; 2.4s badge flips from→to with a pop
    const slide = ease(t / 0.6);
    card.style.transform = `translateY(${(1 - slide) * 90}px)`;
    card.style.opacity = slide;
    const fillP = ease((t - 0.6) / 1.8);
    fill.style.width = `${fillP * 100}%`;
    const flipped = t >= 2.4;
    const pop = spring((t - 2.4) / 0.5);
    badge.textContent = flipped ? P.to : P.from;
    badge.style.background = flipped ? P.color : '#dc2626';
    fill.style.background = flipped ? P.color : '#f59e0b';
    badge.style.transform = flipped ? `scale(${0.7 + 0.3 * pop})` : 'scale(1)';
  };
  seek(0);
</script>
</body>
</html>
